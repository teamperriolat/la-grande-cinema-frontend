services:
  - type: web
    name: la-grande-cinema
    runtime: static
    buildCommand: npm ci && npm run build
    staticPublishPath: ./dist
    envVars:
      - key: VITE_API_BASE_URL
        value: https://la-grande-cinema-api.onrender.com
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
